name: Research checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust theorem and verifier tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Test primary search framework
        run: cargo test --release --manifest-path search-framework/Cargo.toml
      - name: Test independent Rust verifier
        run: cargo test --release --manifest-path verification-framework/Cargo.toml
      - name: Run independent Rust self-test
        run: >-
          cargo run --release
          --manifest-path verification-framework/Cargo.toml
          -- --selftest

  python:
    name: Python certificates and OEIS checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile verification scripts
        run: >-
          python -m py_compile
          verification-framework/verify.py
          independent/verify_small_spectrum.py
          independent/verify_safe_certificate.py
          independent/verify_safe_checkpoint.py
          independent/verify_safe_block_gates.py
          independent/verify_general_gate_boundaries.py
          independent/verify_sharp_growth.py
          independent/verify_ridge_segments.py
          independent/verify_mixed_ridges.py
          scripts/periodic_phase_blocks.py
      - name: Verify published OEIS terms
        run: python verification-framework/verify.py --oeis
      - name: Regenerate the minimal nonsurjectivity certificate
        run: python independent/verify_small_spectrum.py
      - name: Cross-check a bounded safe-map certificate
        run: >-
          python independent/verify_safe_certificate.py
          --n 10000 --max-steps 20000
      - name: Check checkpoint monotonicity and signed safe coordinates
        run: python independent/verify_safe_checkpoint.py
      - name: Check adjacent safe-map block gates
        run: python independent/verify_safe_block_gates.py
      - name: Check exact arbitrary-block gate boundaries
        run: python independent/verify_general_gate_boundaries.py
      - name: Check parameterized rebounds and sharp growth
        run: python independent/verify_sharp_growth.py
      - name: Check post-down ridge segments
        run: python independent/verify_ridge_segments.py
      - name: Check arbitrary mixed-ridge compatibility
        run: python independent/verify_mixed_ridges.py
      - name: Regenerate the denominator-family certificate
        run: python scripts/periodic_phase_blocks.py --max-denominator 501
      - name: Verify committed audit artifact hashes
        shell: bash
        run: |
          sha256sum --check <<'HASHES'
          7f854fbe4d4978a253d5f9ce43f59d2ae62e3301cc0e946af61b74b18baa08ed  certificates/safe_n1000000.txt
          66a06cff15735c4a3caf98575f29afbcd881fbef06334616fbc3bc772b7ab084  certificates/spectrum_m259.csv
          41216cd3830cb97fd809b6aa9f78ee8a3e77ce7f13c7a5244d65ebc7c96beeef  independent/verify_safe_certificate.py
          a0b60e6d229e56adbba04808130218a807817d5471edfc2f659c253b47370e4b  independent/verify_small_spectrum.py
          HASHES

  lean:
    name: Lean foundational formalization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Compile the formalization
        run: lean lean/Conjecture.lean
