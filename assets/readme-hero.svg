<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Cloitre recurrence research package</title>
  <desc id="desc">A scientific banner summarizing the open stabilization conjecture and the project’s strongest proved and certified results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061426"/>
      <stop offset="0.58" stop-color="#09213a"/>
      <stop offset="1" stop-color="#0b2943"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efb64a"/>
      <stop offset="1" stop-color="#ffd98c"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e0cf"/>
      <stop offset="1" stop-color="#9af0e4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .muted{fill:#b9c9d8}
      .small{font-size:18px}
      .tiny{font-size:15px}
    </style>
  </defs>

  <rect width="1600" height="520" rx="24" fill="url(#bg)"/>
  <g opacity=".14" stroke="#79a7c8" fill="none">
    <path d="M0 420 C160 250 270 560 430 370 S700 250 850 410"/>
    <path d="M1060 80 C1220 20 1420 150 1600 40"/>
    <path d="M1180 460 C1300 330 1460 350 1600 250"/>
    <g stroke-dasharray="3 10"><path d="M1020 20V500M1100 20V500M1180 20V500M1260 20V500M1340 20V500M1420 20V500M1500 20V500"/></g>
  </g>

  <text x="68" y="78" class="serif" fill="#f8f6ef" font-size="42" font-weight="700">Structural and arithmetic restrictions on stabilization</text>
  <text x="68" y="125" class="serif" fill="#f8f6ef" font-size="42" font-weight="700">in a modular additive recurrence</text>
  <line x1="68" y1="151" x2="1045" y2="151" stroke="url(#gold)" stroke-width="2"/>
  <text x="68" y="188" class="serif" fill="#82e4d7" font-size="25" font-style="italic">Research package for the Cloitre recurrence</text>
  <text x="532" y="188" class="sans muted" font-size="20">OEIS A073117 / A117846</text>

  <g transform="translate(68 222)">
    <rect width="620" height="132" rx="16" fill="#0b1c30" stroke="#738ba3"/>
    <circle cx="54" cy="66" r="29" fill="#102b46" stroke="#74e0d0"/>
    <circle cx="54" cy="66" r="5" fill="#efb64a"/>
    <circle cx="37" cy="48" r="4" fill="#74e0d0"/>
    <circle cx="73" cy="46" r="4" fill="#efb64a"/>
    <circle cx="34" cy="83" r="4" fill="#efb64a"/>
    <circle cx="76" cy="84" r="4" fill="#74e0d0"/>
    <path d="M39 49L52 62L70 47M36 82L52 69L75 83" stroke="#b8cce0" fill="none"/>
    <line x1="104" y1="25" x2="104" y2="107" stroke="#516c86"/>
    <text x="140" y="54" class="serif" fill="#fffaf0" font-size="34" font-style="italic">b₁ = m</text>
    <text x="140" y="101" class="serif" fill="#fffaf0" font-size="34" font-style="italic">bₙ₊₁ = bₙ + (bₙ mod n)</text>
  </g>

  <g transform="translate(720 222)">
    <rect width="330" height="132" rx="16" fill="#0d2034" stroke="#efb64a"/>
    <path d="M32 91L65 31L98 91Z" fill="none" stroke="#efb64a" stroke-width="6" stroke-linejoin="round"/>
    <line x1="65" y1="52" x2="65" y2="73" stroke="#efb64a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="65" cy="83" r="3.8" fill="#efb64a"/>
    <text x="119" y="57" class="serif" fill="#efb64a" font-size="26">Universal stabilization</text>
    <text x="119" y="94" class="serif" fill="#fff7e6" font-size="29">conjecture: <tspan fill="#ffd36e" font-weight="700">OPEN</tspan></text>
  </g>

  <g transform="translate(1115 62)">
    <circle cx="125" cy="125" r="86" fill="none" stroke="#527b9e" stroke-width="2"/>
    <circle cx="125" cy="125" r="60" fill="none" stroke="#efb64a" stroke-width="3" stroke-dasharray="8 7"/>
    <g fill="#0d2942" stroke="#cde2f4" stroke-width="2">
      <circle cx="125" cy="39" r="10"/><circle cx="185" cy="64" r="10"/><circle cx="211" cy="125" r="10"/><circle cx="185" cy="186" r="10"/>
      <circle cx="125" cy="211" r="10"/><circle cx="64" cy="186" r="10"/><circle cx="39" cy="125" r="10"/><circle cx="64" cy="64" r="10"/>
    </g>
    <circle cx="125" cy="39" r="10" fill="#0e594f" stroke="#82e4d7" stroke-width="2"/>
    <text x="119" y="45" class="sans" fill="#d8fff8" font-size="16">0</text>
    <path d="M132 42C158 45 175 54 183 61M193 72C205 91 210 106 210 117M208 136C202 157 194 174 185 180M174 193C154 205 141 210 134 210M113 209C93 204 77 196 68 188M54 178C43 158 39 143 39 135M40 114C45 93 53 77 62 68M75 55C91 45 105 41 116 40" fill="none" stroke="#f5f7fa" stroke-width="2"/>
    <text x="100" y="121" class="serif" fill="#fff8ec" font-size="34">×2</text>
    <text x="82" y="149" class="serif" fill="#c7d9e7" font-size="21">(mod n+2)</text>
    <text x="245" y="84" class="sans" fill="#d5e4ef" font-size="18">moving modulus</text>
    <text x="245" y="113" class="serif" fill="#82e4d7" font-size="22">eₙ₊₁ ≡ 2eₙ</text>
    <text x="245" y="139" class="serif" fill="#b9c9d8" font-size="19">mod (n+2)</text>
  </g>

  <g transform="translate(68 386)">
    <rect width="444" height="92" rx="14" fill="#0a2237" stroke="#58cfc1"/>
    <circle cx="44" cy="46" r="25" fill="#0e4e49" stroke="#76e1d3"/>
    <path d="M33 45L41 53L56 36" stroke="#d6fff8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="35" class="sans" fill="#7de2d5" font-size="20" font-weight="700">FINITE-START BOUND</text>
    <text x="82" y="68" class="serif" fill="#fff8ec" font-size="26" font-style="italic">m &lt; (c+3)(3c+5)</text>
  </g>

  <g transform="translate(532 386)">
    <rect width="330" height="92" rx="14" fill="#182433" stroke="#efb64a"/>
    <circle cx="44" cy="46" r="25" fill="#4a3614" stroke="#efb64a"/>
    <path d="M44 27L49 39L62 40L52 48L55 61L44 54L33 61L36 48L26 40L39 39Z" fill="none" stroke="#ffd16b" stroke-width="2"/>
    <text x="82" y="35" class="sans" fill="#f5bf57" font-size="20" font-weight="700">CERTIFIED OMISSIONS</text>
    <text x="82" y="68" class="serif" fill="#fff8ec" font-size="27">smallest: 5 and 7</text>
  </g>

  <g transform="translate(882 386)">
    <rect width="650" height="92" rx="14" fill="#0a2237" stroke="#58cfc1"/>
    <circle cx="44" cy="46" r="25" fill="#0e4e49" stroke="#76e1d3"/>
    <text x="31" y="56" class="serif" fill="#d9fff8" font-size="31">∞</text>
    <text x="82" y="34" class="sans" fill="#7de2d5" font-size="19" font-weight="700">ANY COUNTEREXAMPLE MUST BE APERIODIC</text>
    <text x="82" y="67" class="serif" fill="#fff8ec" font-size="24">qₙ = Ωₘ(n/log n),  bₙ = Ωₘ(n²/log n)</text>
  </g>

  <g transform="translate(1168 324)">
    <path d="M0 0H360" stroke="#274c6c"/>
    <text x="0" y="26" class="sans tiny" fill="#8fb2cc">proofs</text>
    <circle cx="68" cy="20" r="3" fill="#efb64a"/>
    <text x="82" y="26" class="sans tiny" fill="#8fb2cc">certificates</text>
    <circle cx="167" cy="20" r="3" fill="#efb64a"/>
    <text x="181" y="26" class="sans tiny" fill="#8fb2cc">compressed search</text>
  </g>
</svg>