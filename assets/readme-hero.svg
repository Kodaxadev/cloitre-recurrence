<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Cloitre recurrence research package</title>
  <desc id="desc">A scientific banner summarizing the open stabilization conjecture and the project's strongest proved and certified results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061426"/>
      <stop offset="0.58" stop-color="#09213a"/>
      <stop offset="1" stop-color="#0b2943"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efb64a"/>
      <stop offset="1" stop-color="#ffd98c"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e0cf"/>
      <stop offset="1" stop-color="#9af0e4"/>
    </linearGradient>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
      .muted{fill:#b9c9d8}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;fill:#66e0cf}
      .note{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#b9c9d8}
      .result{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:19px;fill:#f4f7fb}
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <g opacity="0.06" stroke="#79a7c8">
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Left column -->
  <text x="50" y="70" class="serif" font-size="28" font-weight="bold" fill="#f4f7fb">Structural and arithmetic</text>
  <text x="50" y="104" class="serif" font-size="28" font-weight="bold" fill="#f4f7fb">restrictions on stabilization</text>
  <text x="50" y="138" class="serif" font-size="28" font-weight="bold" fill="#f4f7fb">in a modular additive recurrence</text>
  <rect x="50" y="154" width="200" height="4" fill="url(#gold)"/>

  <text x="50" y="188" class="serif" font-size="15" font-style="italic" fill="#9af0e4">Research package for the Cloitre recurrence</text>
  <text x="50" y="208" class="note">OEIS A073117 / A117846</text>

  <rect x="50" y="232" width="420" height="66" rx="10" fill="#0c2138" stroke="#254a68"/>
  <text x="70" y="258" class="serif" font-size="16" fill="#f4f7fb">b₁ = m</text>
  <text x="70" y="282" class="serif" font-size="16" fill="#f4f7fb">bₙ₊₁ = bₙ + (bₙ mod n)</text>

  <rect x="50" y="312" width="420" height="54" rx="10" fill="#2a1c10" stroke="#efb64a"/>
  <text x="70" y="334" class="note" fill="#efb64a" font-weight="bold">UNIVERSAL STABILIZATION CONJECTURE</text>
  <text x="70" y="354" class="serif" font-size="15" fill="#ffd98c">Status: OPEN</text>

  <!-- Right column: 2x2 result cards -->
  <g>
    <rect x="620" y="50" width="260" height="130" rx="10" fill="#0c2138" stroke="#254a68"/>
    <text x="640" y="80" class="label">Finite-start bound</text>
    <text x="640" y="112" class="result">m &lt; (c+3)(3c+5)</text>
    <text x="640" y="140" class="note">Bounds the starting values that</text>
    <text x="640" y="158" class="note">must be checked exhaustively.</text>
  </g>
  <g>
    <rect x="900" y="50" width="260" height="130" rx="10" fill="#0c2138" stroke="#254a68"/>
    <text x="920" y="80" class="label">Certified omissions</text>
    <text x="920" y="112" class="result">smallest: 5 and 7</text>
    <text x="920" y="140" class="note">Values verified to be excluded</text>
    <text x="920" y="158" class="note">from the stabilization set.</text>
  </g>
  <g>
    <rect x="620" y="200" width="260" height="130" rx="10" fill="#0c2138" stroke="#254a68"/>
    <text x="640" y="230" class="label">Counterexample growth</text>
    <text x="640" y="262" class="result">qₙ = Ω(n/log n)</text>
    <text x="640" y="290" class="note">Any counterexample must be</text>
    <text x="640" y="308" class="note">aperiodic and grow accordingly.</text>
  </g>
  <g>
    <rect x="900" y="200" width="260" height="130" rx="10" fill="#0c2138" stroke="#254a68"/>
    <text x="920" y="230" class="label">Increment growth</text>
    <text x="920" y="262" class="result">bₙ = Ω(n²/log n)</text>
    <text x="920" y="290" class="note">Lower bound on the growth rate</text>
    <text x="920" y="308" class="note">of the sequence itself.</text>
  </g>

  <text x="600" y="368" text-anchor="middle" class="note">Proofs · exact certificates · compressed computation · partial Lean formalization</text>
</svg>
