<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Cloitre recurrence research package</title>
  <desc id="desc">Research banner for the Cloitre stabilization conjecture, highlighting the recurrence, open status, and strongest current partial results.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.58" stop-color="#0a2138"/>
      <stop offset="1" stop-color="#0d2b45"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eeb349"/>
      <stop offset="1" stop-color="#ffdc94"/>
    </linearGradient>
    <style>
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .muted { fill: #b8c8d7; }
      .label { font-size: 19px; font-weight: 700; letter-spacing: .4px; }
    </style>
  </defs>

  <rect width="1600" height="560" rx="24" fill="url(#bg)"/>
  <g opacity=".12" stroke="#83aac7" fill="none">
    <path d="M0 438C170 250 290 590 465 390S760 270 930 430"/>
    <path d="M1080 65C1240 5 1425 145 1600 38"/>
    <path d="M1200 520C1330 360 1480 390 1600 275"/>
    <g stroke-dasharray="3 11">
      <path d="M1040 24V536M1120 24V536M1200 24V536M1280 24V536M1360 24V536M1440 24V536M1520 24V536"/>
    </g>
  </g>

  <text x="68" y="76" class="serif" fill="#f8f6ef" font-size="41" font-weight="700">
    Structural and arithmetic restrictions on stabilization
  </text>
  <text x="68" y="122" class="serif" fill="#f8f6ef" font-size="41" font-weight="700">
    in a modular additive recurrence
  </text>
  <line x1="68" y1="150" x2="1040" y2="150" stroke="url(#gold)" stroke-width="2"/>
  <text x="68" y="187" class="serif" fill="#82e4d7" font-size="25" font-style="italic">
    Research package for the Cloitre recurrence
  </text>
  <text x="535" y="187" class="sans muted" font-size="19">OEIS A073117 / A117846</text>

  <g transform="translate(68 220)">
    <rect width="620" height="136" rx="16" fill="#0b1c30" stroke="#738ba3"/>
    <circle cx="55" cy="68" r="30" fill="#102b46" stroke="#74e0d0"/>
    <circle cx="55" cy="68" r="5" fill="#efb64a"/>
    <circle cx="38" cy="49" r="4" fill="#74e0d0"/>
    <circle cx="75" cy="48" r="4" fill="#efb64a"/>
    <circle cx="36" cy="87" r="4" fill="#efb64a"/>
    <circle cx="78" cy="88" r="4" fill="#74e0d0"/>
    <path d="M40 51L53 64L72 49M38 86L53 72L76 87" stroke="#b8cce0" fill="none"/>
    <line x1="105" y1="26" x2="105" y2="110" stroke="#516c86"/>
    <text x="140" y="56" class="serif" fill="#fffaf0" font-size="33" font-style="italic">b₁ = m</text>
    <text x="140" y="103" class="serif" fill="#fffaf0" font-size="32" font-style="italic">bₙ₊₁ = bₙ + (bₙ mod n)</text>
  </g>

  <g transform="translate(720 220)">
    <rect width="330" height="136" rx="16" fill="#0d2034" stroke="#efb64a"/>
    <path d="M32 94L65 34L98 94Z" fill="none" stroke="#efb64a" stroke-width="6" stroke-linejoin="round"/>
    <line x1="65" y1="55" x2="65" y2="76" stroke="#efb64a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="65" cy="86" r="3.8" fill="#efb64a"/>
    <text x="118" y="53" class="sans" fill="#efb64a" font-size="19" font-weight="700">UNIVERSAL</text>
    <text x="118" y="80" class="sans" fill="#efb64a" font-size="19" font-weight="700">STABILIZATION</text>
    <text x="118" y="111" class="serif" fill="#fff7e6" font-size="28">conjecture: <tspan fill="#ffd36e" font-weight="700">OPEN</tspan></text>
  </g>

  <g transform="translate(1110 54)">
    <circle cx="130" cy="130" r="88" fill="none" stroke="#527b9e" stroke-width="2"/>
    <circle cx="130" cy="130" r="61" fill="none" stroke="#efb64a" stroke-width="3" stroke-dasharray="8 7"/>
    <g fill="#0d2942" stroke="#cde2f4" stroke-width="2">
      <circle cx="130" cy="42" r="10"/><circle cx="192" cy="68" r="10"/><circle cx="218" cy="130" r="10"/><circle cx="192" cy="192" r="10"/>
      <circle cx="130" cy="218" r="10"/><circle cx="68" cy="192" r="10"/><circle cx="42" cy="130" r="10"/><circle cx="68" cy="68" r="10"/>
    </g>
    <circle cx="130" cy="42" r="10" fill="#0e594f" stroke="#82e4d7" stroke-width="2"/>
    <text x="124" y="48" class="sans" fill="#d8fff8" font-size="16">0</text>
    <path d="M137 45C163 48 181 57 190 65M200 77C212 95 217 112 217 122M215 140C209 162 201 179 193 187M181 200C160 212 146 217 138 217M120 216C99 211 82 203 73 195M59 184C47 164 43 148 43 139M44 120C49 98 57 81 66 72M79 59C96 49 112 44 121 43" fill="none" stroke="#f5f7fa" stroke-width="2"/>
    <text x="103" y="128" class="serif" fill="#fff8ec" font-size="34">×2</text>
    <text x="87" y="157" class="serif" fill="#c7d9e7" font-size="21">(mod n+2)</text>

    <text x="245" y="92" class="sans muted" font-size="18">moving modulus</text>
    <text x="245" y="124" class="serif" fill="#82e4d7" font-size="22">eₙ₊₁ ≡ 2eₙ</text>
    <text x="245" y="153" class="serif" fill="#b9c9d8" font-size="19">mod (n+2)</text>
  </g>

  <g transform="translate(68 392)">
    <rect width="444" height="104" rx="14" fill="#0a2237" stroke="#58cfc1"/>
    <circle cx="45" cy="52" r="25" fill="#0e4e49" stroke="#76e1d3"/>
    <path d="M34 51L42 59L57 42" stroke="#d6fff8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="40" class="sans label" fill="#7de2d5">FINITE-START BOUND</text>
    <text x="84" y="76" class="serif" fill="#fff8ec" font-size="26" font-style="italic">m &lt; (c+3)(3c+5)</text>
  </g>

  <g transform="translate(532 392)">
    <rect width="330" height="104" rx="14" fill="#182433" stroke="#efb64a"/>
    <circle cx="45" cy="52" r="25" fill="#4a3614" stroke="#efb64a"/>
    <path d="M45 33L50 45L63 46L53 54L56 67L45 60L34 67L37 54L27 46L40 45Z" fill="none" stroke="#ffd16b" stroke-width="2"/>
    <text x="84" y="40" class="sans label" fill="#f5bf57">CERTIFIED OMISSIONS</text>
    <text x="84" y="76" class="serif" fill="#fff8ec" font-size="26">smallest: 5 and 7</text>
  </g>

  <g transform="translate(882 392)">
    <rect width="650" height="104" rx="14" fill="#0a2237" stroke="#58cfc1"/>
    <circle cx="45" cy="52" r="25" fill="#0e4e49" stroke="#76e1d3"/>
    <text x="32" y="62" class="serif" fill="#d9fff8" font-size="31">∞</text>
    <text x="84" y="39" class="sans" fill="#7de2d5" font-size="18" font-weight="700">ANY COUNTEREXAMPLE MUST BE APERIODIC</text>
    <text x="84" y="76" class="serif" fill="#fff8ec" font-size="23">qₙ = Ωₘ(n/log n) · bₙ = Ωₘ(n²/log n)</text>
  </g>

  <text x="1532" y="532" text-anchor="end" class="sans" fill="#8fb2cc" font-size="15">
    proofs · certificates · compressed computation
  </text>
</svg>