<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Cloitre recurrence research package</title>
  <desc id="heroDesc">The recurrence and its structural coordinate, with the four evidence classes: the conjecture is open, the safe-map reduction is proved through Corollary 147, the K18 and K19 word classifications are exhaustive computation, and the results are independently verified.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.58" stop-color="#0a2138"/>
      <stop offset="1" stop-color="#0d2b45"/>
    </linearGradient>
    <style>
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .muted { fill: #b9c9d8; }
      .label { font-size: 17px; font-weight: 700; letter-spacing: 1.1px; }
      .body { font-size: 17px; }
    </style>
  </defs>

  <rect width="1600" height="560" rx="24" fill="url(#bg)"/>

  <!-- Decorative field: a doubling trajectory against a moving modulus. Purely
       ornamental, low contrast, and never overlapping text. -->
  <g opacity=".11" stroke="#83aac7" fill="none" stroke-width="2">
    <path d="M64 470C210 300 320 600 470 410S740 300 812 452"/>
    <g stroke-dasharray="3 11">
      <path d="M120 96V468M220 96V468M320 96V468M420 96V468M520 96V468M620 96V468M720 96V468"/>
    </g>
  </g>

  <!-- ============ LEFT: the recurrence, visually central ============ -->

  <text x="64" y="72" class="sans muted" font-size="16" letter-spacing="1.6">RESEARCH PACKAGE &#183; OEIS A073117 / A117846</text>
  <text x="64" y="124" class="serif" fill="#fff8ec" font-size="40">The Cloitre recurrence</text>

  <g transform="translate(64,168)">
    <rect width="748" height="150" rx="16" fill="#0a2237" stroke="#2f5f80" stroke-width="1.5"/>
    <text x="36" y="60" class="serif" fill="#fff8ec" font-size="30">b&#8321; = m</text>
    <text x="36" y="112" class="serif" fill="#fff8ec" font-size="34">b&#8345;&#8330;&#8321; = b&#8345; + (b&#8345; mod n)</text>
  </g>

  <g transform="translate(64,346)">
    <text x="0" y="18" class="sans label" fill="#7de2d5">STRUCTURAL COORDINATE</text>
    <text x="0" y="60" class="serif" fill="#fff8ec" font-size="25">e&#8345; = r&#8345; &#8722; q&#8345;,&#8195;e&#8345;&#8330;&#8321; &#8801; 2e&#8345; (mod n+2)</text>
    <text x="0" y="94" class="serif muted" font-size="20">a doubling map with a moving modulus &#183; stabilization is exactly e&#8345; = 0</text>
  </g>

  <text x="64" y="516" class="sans muted" font-size="16">proofs &#183; exact certificates &#183; compressed search &#183; Lean formalization</text>

  <!-- ============ RIGHT: the four evidence classes ============ -->

  <!-- OPEN -->
  <g transform="translate(860,48)">
    <rect width="676" height="104" rx="14" fill="#2a1418" stroke="#e0685f" stroke-width="1.5"/>
    <rect width="5" height="104" rx="2.5" fill="#e0685f"/>
    <text x="28" y="38" class="sans label" fill="#f0897f">OPEN</text>
    <text x="28" y="68" class="serif body" fill="#fff8ec">Universal stabilization &#8212; no proof is claimed.</text>
    <text x="28" y="92" class="sans body muted">Exhaustively verified only for m &#8804; 10&#8311;.</text>
  </g>

  <!-- PROVED -->
  <g transform="translate(860,170)">
    <rect width="676" height="104" rx="14" fill="#0a2237" stroke="#58cfc1" stroke-width="1.5"/>
    <rect width="5" height="104" rx="2.5" fill="#58cfc1"/>
    <text x="28" y="38" class="sans label" fill="#7de2d5">PROVED &#183; STRUCTURAL REDUCTION</text>
    <text x="28" y="68" class="sans body" fill="#fff8ec">Gate continuation is forced, not branching; the survivor is a closed orbit.</text>
    <text x="28" y="92" class="sans body muted">What remains: a one-dimensional expanding recurrence against a moving window.</text>
  </g>

  <!-- EXHAUSTIVE COMPUTATION -->
  <g transform="translate(860,292)">
    <rect width="676" height="104" rx="14" fill="#211a10" stroke="#efb64a" stroke-width="1.5"/>
    <rect width="5" height="104" rx="2.5" fill="#efb64a"/>
    <text x="28" y="38" class="sans label" fill="#f5bf57">EXHAUSTIVE COMPUTATION &#8212; NOT A THEOREM</text>
    <text x="28" y="68" class="sans body" fill="#fff8ec">K18 &#183; 6 two-gap words &#183; 2,706 states</text>
    <text x="28" y="92" class="sans body" fill="#fff8ec">K19 &#183; 9 three-gap words &#183; 342 states &#183; 74 continue to a fourth gate</text>
  </g>

  <!-- VERIFIED -->
  <g transform="translate(860,414)">
    <rect width="676" height="104" rx="14" fill="#0a2237" stroke="#5b9fd0" stroke-width="1.5"/>
    <rect width="5" height="104" rx="2.5" fill="#5b9fd0"/>
    <text x="28" y="38" class="sans label" fill="#8cc4ec">VERIFIED</text>
    <text x="28" y="68" class="sans body" fill="#fff8ec">Lean 4 with no sorry &#183; three independent recurrence implementations</text>
    <text x="28" y="92" class="sans body muted">Byte-identical certificates regenerated on Ubuntu and Windows.</text>
  </g>
</svg>
